<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>系列封面</title>
<style>
  /* 系列统一封面：纸色底、左文右图、一种字体两种字重；不用渐变、边框和角落标签 */
  :root { --paper:#fbfbfa; --strong:#18181a; --text:#57575a; --muted:#8c8c90; }
  html, body { margin:0; background:var(--paper); }
  #c { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--paper); font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; }
  #fig { position:absolute; left:0; top:0; width:1920px; height:1080px; border:0; transform-origin:0 0; }
  #txt { position:absolute; left:120px; top:0; height:1080px; width:820px; display:flex; flex-direction:column; justify-content:center; }
  .series { font-weight:700; font-size:40px; color:var(--strong); letter-spacing:2px; }
  .series .ep { font-weight:400; color:var(--muted); margin-left:18px; }
  .rule { width:72px; height:5px; background:var(--strong); margin:34px 0 26px; }
  .name { font-weight:700; font-size:250px; line-height:.9; color:var(--strong); letter-spacing:-6px; }
  .sub { font-weight:700; font-size:54px; color:var(--strong); margin-top:30px; line-height:1.25; white-space:nowrap; }
  .meta { font-weight:400; font-size:34px; color:var(--muted); margin-top:22px; }
</style></head>
<body><div id="c"><iframe id="fig"></iframe>
  <div id="txt"><div class="series"><span id="series"></span><span class="ep" id="ep"></span></div><div class="rule"></div>
    <div class="name" id="name"></div><div class="sub" id="sub"></div><div class="meta" id="meta"></div></div></div>
<script>
// 参数：?series=系列名&ep=01&name=H100&sub=…&meta=…&figsrc=/anatomy/hgx/hgx-light.html&pose=JSON&x=700&y=60&s=0.66
// figsrc 是物件图在服务根目录下的绝对路径；x、y、s 是物件放在右侧的位置和缩放（同一系列保持不变）
const q = new URLSearchParams(location.search), $ = (s) => document.querySelector(s);
$("#series").textContent = q.get("series") || "硬核拆解英伟达 GPU";
$("#ep").textContent = "第 " + (q.get("ep") || "01") + " 集";
$("#name").textContent = q.get("name") || "H100";
$("#sub").textContent = q.get("sub") || "从八卡底板拆到 Tensor Core";
$("#meta").textContent = q.get("meta") || "Hopper 架构 · 2022";
const fig = $("#fig");
fig.src = q.get("figsrc");
// 物件放在右侧：缩放与位置固定，系列每集一致
fig.style.transform = `translate(${q.get("x") || 700}px, ${q.get("y") || 60}px) scale(${q.get("s") || 0.66})`;
fig.addEventListener("load", () => {
  const w = fig.contentWindow, chk = () => {
    if (!w.__ready) return setTimeout(chk, 50);
    const d = w.document, st = d.createElement("style"); st.textContent = ".iso{--anatomy-weight:1.2px} .iso-solid[data-lit]>.iso-edge{stroke-width:2px}"; d.head.appendChild(st);
    const pose = JSON.parse(q.get("pose") || "null");
    const apply = (p) => { if (p && w.pose) w.pose(p); else if (p && w.render) w.render(0, p); else if (w.render) w.render(Number(q.get("t") || 0)); };
    apply(pose);
    // 片头用：window.render(t) 让物件从合拢状态缓动到封面姿态（0.3–1.9 秒），之后停在和封面图一样的画面
    window.render = (t) => { if (!pose) return apply(null); const x = Math.min(1, Math.max(0, (t - 0.3) / 1.6)), k = x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      apply(Object.fromEntries(Object.entries(pose).map(([key, v]) => [key, v * k]))); };
    window.__ready = true;
  }; chk();
});
</script></body></html>
